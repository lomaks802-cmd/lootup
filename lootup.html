cs:()=>{const A=CA[CT],WL=WA[CT];return `<h2>Кейсы</h2><div class="chips">${[['g','🎁 Подарки'],['w','🔫 Оружие'],['f','⚖️ 50/50'],['t','🎭 Темы']].map(x=>`<button class="chip ${CT==x[0]?'on':''}" onclick="CT='${x[0]}';R()">${x[1]}</button>`).join('')}</div><div class="sub">×2, ×3, ×5 — несколько кейсов сразу, цена умножается</div><div class="chips">${[1,2,3,5].map(m=>`<button class="chip ${M==m?'on':''}" onclick="M=${m};R()">×${m}</button>`).join('')}</div><div class="cgrid">`+A.map((c,k)=>{const p=c[2]*M,top=[...WL[k]].sort((a,b)=>b.o.v-a.o.v).slice(0,3);

up:()=>{const bet=up.mode=='bet',v=sv(),t=v>0?tg(v,up.m):-1,c=t>=0?(S.gold==1?1:ch(v,t)):0,s=up.s>=0?S.inv[up.s]:-1;

 let h=`<h2>Апгрейд</h2>${S.gold==1?'<div class="hint">🔥 GOLDA активен: следующий апгрейд — 100 %</div>':''}<div class="chips"><button class="chip ${bet?'':'on'}" onclick="up.mode='skin';R()">Скин со склада</button><button class="chip ${bet?'on':''}" onclick="up.mode='bet';R()">Ставка ₽</button></div><div class="chips"><button class="chip ${up.cat=='g'?'on':''}" onclick="up.cat='g';R()">Цель: подарки</button><button class="chip ${up.cat=='w'?'on':''}" onclick="up.cat='w';R()">Цель: оружие</button></div>
 <div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="82" fill="none" stroke="#2a1a47" stroke-width="14"/>${t>=0?`<circle cx="100" cy="100" r="82" fill="none" stroke="#ffc83d" stroke-width="14" stroke-dasharray="${c*515.2} 516" transform="rotate(-90 100 100)"/>`:''}</svg><div class="ctr">${t>=0?E(IT[t][1]):'❔'}</div><div class="nd" id="nd"></div></div>
 <div class="pc" id="pc">${t>=0?'Шанс '+(c*100).toFixed(1).replace('.',',')+' %':bet?'Выбери ставку':'Выбери скин'}</div>
 <div class="row" style="margin:12px 0"><div class="slot">${bet?sl('🪙','Ставка',up.bet):s>=0?sl(E(IT[s][1]),IT[s][0],IT[s][2]):'Твой скин<br>со склада'}</div><div style="font-size:22px">→</div><div class="slot">${t>=0?sl(E(IT[t][1]),IT[t][0],IT[t][2]):'Хочу получить'}</div></div>
 <div class="chips">${MU.map(m=>`<button class="chip ${up.m==m?'on':''}" onclick="pM(${m})">×${m}</button>`).join('')}</div>`;
 if(bet)h+=`<div class="chips">${BT.map(x=>`<button class="chip ${up.bet==x?'on':''}" onclick="up.bet=${x};R()">${x} ₽</button>`).join('')}<button class="chip" onclick="up.bet=Math.max(1,Math.floor(S.b));R()">Всё</button></div>`;
 h+=`<div class="row"><button class="btn gold" ${t<0?'disabled':''} onclick="doUp()">Улучшить</button><button class="btn alt" style="width:auto" onclick="upEnd&&upEnd()">Skip</button></div>`;
 if(bet)return h+`<div class="sub" style="margin-top:10px">Ставка списывается сразу. Победа — получаешь подарок на склад, проигрыш — ставка сгорает.</div>`;
 if(!S.inv.length)return h+`<div class="card">Склад пуст. Открой кейс — подарки появятся здесь.</div>`;
 return h+`<h2 style="font-size:15px">Твои подарки</h2><div class="items">${S.inv.map((i,k)=>`<button class="it ${k==up.s?'sel':''}" style="--c:${col(IT[i][2])}" onclick="pS(${k})"><span class="e">${E(IT[i][1])}</span>${IT[i][0]}<b>${f(IT[i][2])}</b></button>`).join('')}</div>`},
ch:()=>{const p=DIF[cw.d][0],dead=cw.end==1,car=i=>`<i class="car" style="--t:${3+i%4}s;animation-delay:-${i*.7%3}s;${i%2?'top:auto;bottom:-50px;animation-name:drv2;transform:rotate(90deg)':'transform:rotate(-90deg)'}">${['🚗','🚕','🚙','🚌'][i%4]}</i>`;

 return `<h2>Курочка</h2><div class="sub">Светофор горит зелёным — курочка прыгает на следующую полосу. Каждый прыжок увеличивает множитель, но машина может не успеть затормозить.</div><div class="rdw"><div class="rd" style="width:910px">${cells}${dead?`<i class="boom2" style="left:${cw.k*70+14}px">💥</i>`:`<img id="hen" class="hen" src="${CHK}" alt="" style="left:${cw.k*70+6}px">`}</div></div><div class="pc" id="cm">×${chMu(cw.k).toFixed(2)}</div>`+(cw.on?`<div class="row"><button class="btn gold" id="cs" onclick="chStep()">Шаг ×${chMu(cw.k+1).toFixed(2)}</button><button class="btn alt" id="cc" ${cw.k?'':'disabled'} onclick="chCash()">Забрать ${f(cw.bet*chMu(cw.k))}</button></div>`:`<div class="chips">${DIF.map((d,i)=>`<button class="chip ${cw.d==i?'on':''}" onclick="cw.d=${i};R()">${d[1]}</button>`).join('')}</div><div class="chips">${MB.map(x=>`<button class="chip ${cw.bet==x?'on':''}" onclick="cw.bet=${x};R()">${x} ₽</button>`).join('')}</div><button class="btn gold" onclick="chStart()">Играть за ${f(cw.bet)}</button>`)},
sl:()=>`<h2>Барабан</h2><div class="cab"><div class="sign">LOOTUP SLOTS</div><div class="bl">${'<i></i>'.repeat(14)}</div><div class="row" style="align-items:center"><div class="rls">${[0,1,2].map(r=>`<div class="rw"><div class="st3" id="rl${r}">${[syw(),sl.f[r],syw()].map(i=>`<div class="sym">${SY[i][1]}</div>`).join('')}</div></div>`).join('')}</div><button class="lev" aria-label="Рычаг" onclick="slSpin()"><i class="arm"></i><i class="ball"></i></button></div><div id="slr" style="text-align:center;min-height:34px;font:900 20px Unbounded,sans-serif;margin-top:10px"></div></div>
 <div class="chips" style="margin-top:12px">${MB.map(x=>`<button class="chip ${sl.bet==x?'on':''}" onclick="sl.bet=${x};R()">${x} ₽</button>`).join('')}</div>

bt:()=>{const A=CA[bt.cat],c=A[bt.k],ch2=(l,v,k,cb)=>`<div class="chips">${l.map(x=>`<button class="chip ${v==x?'on':''}" onclick="${cb(x)}">${k(x)}</button>`).join('')}</div>`;

 <div class="card"><b>Создать батл</b>${ch2(['g','w','f','t'],bt.cat,x=>({g:'🎁 Подарки',w:'🔫 Оружие',f:'⚖️ 50/50',t:'🎭 Темы'})[x],x=>`bt.cat='${x}';bt.k=0;R()`)}<div class="chips">${A.map((x,k)=>`<button class="chip ${bt.k==k?'on':''}" onclick="bt.k=${k};R()">${x[1]} ${x[0]}</button>`).join('')}</div><div class="sub">Раундов</div>${ch2([1,2,3,4],bt.r,x=>'×'+x,x=>`bt.r=${x};R()`)}<div class="sub">Игроков</div>${ch2([2,3,4],bt.n,x=>x,x=>`bt.n=${x};R()`)}<button class="btn gold" onclick="btStart()">Создать батл за ${f(c[2]*bt.r)}</button></div>`},
pl:()=>{const pg=[];for(let r=0;r<8;r++)for(let j=0;j<=r;j++)pg.push(`<i class="pg" style="left:${160+(j-r/2)*34-3}px;top:${r*29+22}px"></i>`);

 return `<h2>Мины</h2><div class="sub">Открывай клетки с алмазами. Больше мин — быстрее растёт множитель. Мина — ставка сгорает.</div><div class="mg">${cells}</div>`+(mn.on?`<div class="pc">×${mn.mu.toFixed(2)}</div><div class="sub" style="text-align:center">Следующий ×${nx.toFixed(2)}</div><button class="btn gold" style="margin-top:10px" ${k?'':'disabled'} onclick="mnCash()">Забрать ${f(mn.bet*mn.mu)}</button>`:`<div class="chips">${MB.map(x=>`<button class="chip ${mn.bet==x?'on':''}" onclick="mn.bet=${x};R()">${x} ₽</button>`).join('')}</div><div class="chips">${[1,3,5,10,20].map(x=>`<button class="chip ${mn.m==x?'on':''}" onclick="mn.m=${x};R()">${x} 💣</button>`).join('')}</div><button class="btn gold" onclick="mnStart()">Играть за ${f(mn.bet)}</button>`)},
rk:()=>{const w=rk.ph=='wait',fl=rk.ph=='fly',cr=rk.ph=='crash',bt=w?10:Math.min(60,10+(rk.m-1)*8),lf=w?8:Math.min(62,8+(rk.m-1)*5),l=Math.max(0,5-(Date.now()-rk.t0)/1e3);
 let btn,act='';if(fl&&rk.in&&!rk.cashed){btn='Забрать '+f(rk.bet*rk.m);act='rkCash()'}else if(fl&&rk.in)btn='Забрано +'+f(rk.w);else if(rk.pb){btn='Ставка '+f(rk.pb)+' принята · отмена';act='rkCancel()'}else{btn=w?'Сделать ставку · '+f(rk.sel):'Сделать ставку на следующий раунд';act='rkBet()'}

 <div class="sky ${fl?'fly':''} ${cr?'boom':''}"><div class="stars"></div>${w?'':`<div class="mult" id="rm" style="color:${cr?'#ff3d81':'#c9c9e0'}">${rk.m.toFixed(2).replace('.',',')}×</div>`}${w?`<div class="ringc"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="#26264a" stroke-width="6"/><circle id="cda" cx="60" cy="60" r="54" fill="none" stroke="#7a6cff" stroke-width="6" stroke-dasharray="${l/5*339} 340" transform="rotate(-90 60 60)"/></svg><b id="cd">${Math.max(1,Math.ceil(l))}</b></div>`:''}<div class="clouds"></div>
 <div class="rkt ${cr?'par':''}" id="rkt" style="${cr?`--b:${bt}%;`:`bottom:${bt}%;`}left:${lf}%"><img class="ck" src="${CHK}" alt="">${cr?'<u class="pr">🪂</u>':'<i class="rc">🚀</i>'}</div>${cr?`<div class="rk2" style="bottom:${bt}%;left:${lf}%">🚀</div>`:''}</div>
 <button class="btn ${fl&&rk.in&&!rk.cashed?'gold':''}" id="rb" ${act?`onclick="${act}"`:'disabled'}>${btn}</button>
 <div class="sub" style="margin-top:8px">Ставка</div><div class="chips">${MB.map(x=>`<button class="chip ${rk.sel==x?'on':''}" onclick="rk.sel=${x};R()">${x} ₽</button>`).join('')}</div>
 <div class="sub">Авто-вывод на множителе</div><div class="chips">${[0,1.5,2,3,5,10].map(x=>`<button class="chip ${rk.auto==x?'on':''}" onclick="rk.auto=${x};R()">${x?'×'+x:'Выкл'}</button>`).join('')}</div>
